name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug
      - name: Prepare direct APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WebForge-AI.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebForge-AI-debug-apk
          path: WebForge-AI.apk
          if-no-files-found: error
      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          TAG="build-${RUN_NUMBER}"
          gh release create "$TAG" WebForge-AI.apk --repo "$GITHUB_REPOSITORY" --title "WebForge AI build ${RUN_NUMBER}" --notes "Direct APK download for WebForge AI."
